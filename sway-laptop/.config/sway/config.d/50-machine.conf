# Internal display
# Adjust resolution/scale after running `swaymsg -t get_outputs` on the laptop
output eDP-1 res 1920x1200 pos 0 0 scale 1.5

# Optional: pre-declare common external outputs for docking.
# Sway ignores these if the output isn't connected.
# output HDMI-A-1 res 1920x1080@60Hz pos 1920 0
# output DP-1 res 2560x1440@60Hz pos 1920 0

# Touchpad
input type:touchpad {
    #tap enabled                    # tap to click
    #tap_button_map lrm             # 1 finger = left, 2 fingers = right, 3 fingers = middle
    natural_scroll enabled         # scroll content moves with fingers (macOS-style)
    dwt enabled                    # disable touchpad while typing
    #middle_emulation enabled       # left+right click simultaneously = middle click
    accel_profile adaptive         # touchpads feel wrong with flat acceleration
    #scroll_method two_finger       # standard two-finger scrolling
}

# Lid switch: turn off internal display on close, back on when opened.
# Suspend behavior is handled by logind, not sway.
bindswitch --reload --locked lid:on output eDP-1 disable
bindswitch --reload --locked lid:off output eDP-1 enable
